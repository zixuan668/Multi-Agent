<div id="handoffModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="handoffTitle">
  <div class="modal handoff-simple">
    <button class="modal-close" id="closeHandoff" aria-label="关闭">×</button>
    <div class="handoff-hero">
      <h2 id="handoffTitle">把策略交给创意智能体</h2>
      <p class="handoff-description">确认本次产品需求与策略，开始创作广告内容。</p>
      <div class="agent-bridge"><div class="agent-node from"><small>营销策略智能体</small><strong>策略方案已完成</strong></div><div class="bridge-line"><span class="bridge-arrow">→</span></div><div class="agent-node to"><small>广告创意智能体</small><strong>准备接收策略</strong></div></div>
    </div>
    <div class="modal-body">
      <div class="handoff-summary-card"><div class="checks"></div></div>
      <div class="modal-actions"><span class="chip good">4 / 4 项检查通过</span><div class="right"><button class="btn" id="cancelHandoff">返回策略</button><button class="btn primary" id="acceptHandoff">确认交付，开始创作 →</button></div></div>
    </div>
  </div>
</div>
