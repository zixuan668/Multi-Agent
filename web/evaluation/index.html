<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05060a">
  <meta name="description" content="查看营销方案的评分、风险与优化建议。">
  <title>智策营销 · 效果评估</title>
  <link rel="icon" href="/evaluation/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/evaluation/style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到评估内容</a>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="智策营销首页"><span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span><span>智策营销</span></a>
    <nav aria-label="工作台导航">
      <button class="nav-item active" data-view="workbench" aria-label="评估总览" title="评估总览" aria-current="page"><span data-icon="grid"></span><span>评估总览</span></button>
      <button class="nav-item" data-view="versions" aria-label="轮次与版本" title="轮次与版本"><span data-icon="layers"></span><span>轮次与版本</span></button>
      <button class="nav-item" data-view="events" aria-label="协同过程" title="协同过程"><span data-icon="activity"></span><span>协同过程</span></button>
      <button class="nav-item" data-view="report" aria-label="结果报告" title="结果报告"><span data-icon="file"></span><span>结果报告</span></button>
    </nav>
    <div class="workspace-tools">
      <button class="nav-item" id="history-btn"><span data-icon="clock"></span><span>本地记录</span><span id="history-count" class="count">0</span></button>
      <button class="nav-item" id="config-btn"><span data-icon="sliders"></span><span>评估设置</span></button>
    </div>
    <div class="sidebar-bottom">
      <button class="animation-toggle" id="motion-btn" aria-pressed="true"><span data-icon="sparkles"></span><span id="motion-label">流程动效</span><span class="toggle"><i></i></span></button>
      <div class="mode-card"><span class="live-dot"></span>离线演示<span>不调用模型</span></div>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar">
      <div class="breadcrumb">营销工作空间<span>/</span><b>效果评估</b></div>
      <div class="topbar-right">
        <span class="system-status"><i></i>离线演示</span>
        <button class="icon-button quick-tool" data-action="history" aria-label="本地记录" title="本地记录"><span data-icon="clock"></span></button>
        <button class="icon-button quick-tool" data-action="config" aria-label="评估设置" title="评估设置"><span data-icon="sliders"></span></button>
        <button class="icon-button" id="mobile-motion" aria-label="暂停流程动效" aria-pressed="true"><span data-icon="sparkles"></span></button>
        <button class="icon-button" id="help-btn" aria-label="使用说明" title="使用说明"><span data-icon="help"></span></button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div class="offline-return"><strong>这是预设样例演示，不是你的任务评估。</strong><a class="button primary" href="/workspace?view=evaluation">查看毛小纯的真实任务评估 →</a></div>
      <div class="page-heading">
        <div><h1 id="page-title">效果评估</h1><p id="page-subtitle">先看结果，再决定下一步。</p></div>
        <div class="heading-actions">
          <button class="button secondary" id="import-btn"><span data-icon="upload"></span>导入记录</button>
          <button class="button primary" id="run-btn"><span data-icon="play"></span><span>重新评估</span></button>
        </div>
      </div>
      <div class="task-bar">
        <div class="task-name"><label for="product-select">产品样例</label><select id="product-select" aria-label="选择产品样例"><option>正在载入…</option></select></div>
        <div class="scenario-select"><label for="scenario-select">评估场景</label><select id="scenario-select" aria-label="选择评估场景"></select></div>
      </div>
      <div id="error-banner" class="error-banner" role="alert" hidden></div>
      <section id="view-workbench" class="view" aria-label="评估总览">
        <div class="overview-grid">
          <section class="panel score-panel" aria-labelledby="score-title">
            <div class="panel-heading"><div class="score-heading"><h2 id="score-title">综合评分</h2><span id="current-round" class="small-label"></span></div><button class="icon-button" id="score-help" aria-label="评分规则"><span data-icon="info"></span></button></div>
            <div class="score-body">
              <div class="score-visual"><svg class="score-ring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="80" class="ring-track"/><circle cx="100" cy="100" r="80" class="ring-progress" id="ring-progress"/></svg><div class="score-value"><span id="total-score">—</span><small>满分 100</small></div></div>
              <div class="score-summary"><span id="assessment-badge" class="badge green">正在载入</span><p id="pass-threshold">通过线 80.0</p><span id="score-delta" class="score-delta">正在载入结果</span></div>
            </div>
          </section>
          <section class="panel dimensions-panel" aria-labelledby="dimensions-title"><div class="panel-heading"><h2 id="dimensions-title">五维评分</h2><span class="small-label">点击查看依据 ↗</span></div><div id="dimensions"></div></section>
        </div>
        <div class="details-grid">
          <section class="panel feedback-panel" aria-labelledby="feedback-title"><div class="panel-heading"><h2 id="feedback-title">下一步行动</h2><span data-icon="arrow-up-right" class="muted-icon"></span></div><div id="feedback"></div></section>
          <section class="panel risks-panel" aria-labelledby="risks-title">
            <div class="panel-heading"><h2 id="risks-title">风险检查</h2><span id="risk-count" class="risk-number">0</span></div>
            <div class="risk-filter" role="group" aria-label="风险等级筛选"><button data-filter="all" class="active" aria-pressed="true">全部</button><button data-filter="high" aria-pressed="false">严重 <span id="high-count">0</span></button><button data-filter="medium" aria-pressed="false">中等</button><button data-filter="low" aria-pressed="false">低</button></div>
            <div id="risks"></div>
          </section>
        </div>
        <details class="panel context-panel">
          <summary><span>查看方案内容</span><span class="disclosure-hint">需求、策略与创意</span><span class="disclosure-arrow" aria-hidden="true">⌄</span></summary>
          <div class="panel-heading"><div class="segmented" role="group" aria-label="内容切换"><button data-context="requirements" class="active" aria-pressed="true">原始需求</button><button data-context="strategy" aria-pressed="false">营销策略</button><button data-context="creative" aria-pressed="false">广告创意</button></div></div>
          <div id="context-content"></div>
        </details>
        <details class="panel engine-panel" id="collaboration-details">
          <summary><span>查看协作流程</span><span id="engine-badge" class="badge cyan">等待载入</span><span class="disclosure-arrow" aria-hidden="true">⌄</span></summary>
          <div class="particle-stage" id="particle-stage">
            <canvas id="flow-canvas" aria-label="策略、创意与评估之间的数据流" role="img"></canvas>
            <div class="flow-node strategy-node"><div class="node-icon" data-icon="compass"></div><b>营销策略</b><small id="strategy-version">V1</small></div>
            <div class="flow-node creative-node"><div class="node-icon" data-icon="pen"></div><b>广告创意</b><small id="creative-version">V1</small></div>
            <div class="flow-node evaluation-node"><div class="node-icon" data-icon="aperture"></div><b>效果评估</b><small id="evaluation-version">V1</small></div>
            <div class="flow-caption"><span id="flow-direction">策略 → 创意 → 评估</span></div>
          </div>
          <div class="engine-footer"><div><span class="micro-label">执行状态</span><b id="task-status">—</b></div><div><span class="micro-label">评估轮次</span><b id="round-counter">—</b></div><div><span class="micro-label">终止原因</span><b id="termination">—</b></div><button class="text-link" data-view="events">查看过程 ↗</button></div>
          <p class="task-reference">任务编号 <span id="task-id">—</span></p>
        </details>
      </section>
      <section id="view-versions" class="view" aria-label="轮次与版本" hidden></section>
      <section id="view-events" class="view" aria-label="协同过程" hidden></section>
      <section id="view-report" class="view" aria-label="结果报告" hidden></section>
      <footer class="page-footer">演示数据 · 评分仅供方案参考</footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title">详情</h2><button id="dialog-close" class="icon-button" aria-label="关闭详情"><span data-icon="x"></span></button></div><div id="dialog-content"></div></dialog>
  <input type="file" id="file-input" accept="application/json,.json" hidden>
  <script type="module" src="/evaluation/app.js"></script>
</body>
</html>
